    <script>
      // Gracefully prevent unhandled WebSocket errors from bubbling in preview environment
      window.addEventListener('error', function(event) {
        if (event?.message && /WebSocket/i.test(event.message)) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var reasonMsg = event?.reason?.message || String(event?.reason || '');
        if (/WebSocket/i.test(reasonMsg)) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
