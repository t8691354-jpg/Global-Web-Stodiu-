<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#06b6d4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle for Android -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#accent)" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Glowing background orb -->
  <circle cx="256" cy="256" r="160" fill="url(#glow)" filter="blur(30px)" opacity="0.6"/>

  <!-- Outer Cyber Tech Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 12"/>

  <!-- Globe / World Wireframe -->
  <!-- Outer circle -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#accent)" stroke-width="12" filter="url(#shadow)"/>
  
  <!-- Equator & Latitude lines -->
  <line x1="126" y1="256" x2="386" y2="256" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="256" cy="256" rx="130" ry="60" fill="none" stroke="url(#accent)" stroke-width="8" stroke-opacity="0.8"/>
  <ellipse cx="256" cy="256" rx="60" ry="130" fill="none" stroke="url(#accent)" stroke-width="8" stroke-opacity="0.85"/>
  <line x1="256" y1="126" x2="256" y2="386" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>

  <!-- Central Core Pulse Monogram Node -->
  <circle cx="256" cy="256" r="28" fill="#020617" stroke="#22d3ee" stroke-width="6"/>
  <circle cx="256" cy="256" r="14" fill="#22d3ee"/>

  <!-- Orbiting Satellite Connection Nodes -->
  <circle cx="348" cy="164" r="10" fill="#38bdf8"/>
  <circle cx="164" cy="348" r="8" fill="#818cf8"/>
  <circle cx="370" cy="280" r="7" fill="#22d3ee"/>
</svg>
